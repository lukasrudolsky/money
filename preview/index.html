<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Kolik ti dají banky</title>
<style>
  :root {
    --bg: #04352A;
    --card: rgba(255, 255, 255, 0.06);
    --card-hover: rgba(255, 255, 255, 0.10);
    --line: rgba(255, 255, 255, 0.16);
    --mint: #5EEAD4;
    --mint-dim: rgba(94, 234, 212, 0.14);
    --ink: #022C22;
    --fg: #FFFFFF;
    --fg-soft: rgba(255, 255, 255, 0.72);
    --fg-faint: rgba(255, 255, 255, 0.55);
    --ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --dur: 220ms;
  }

  @media (prefers-reduced-motion: reduce) {
    :root { --dur: 1ms; }
  }

  * { box-sizing: border-box; }

  /* display:flex below would otherwise win over the hidden attribute */
  [hidden] { display: none !important; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--ui);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }

  button, a { font: inherit; color: inherit; }
  button { border: 0; background: none; cursor: pointer; }

  :focus-visible {
    outline: 2px solid var(--mint);
    outline-offset: 3px;
    border-radius: 4px;
  }

  /* ---- shell ------------------------------------------------------- */

  .bar { height: 4px; width: 100%; background: rgba(255, 255, 255, 0.12); flex: none; }
  .bar > i {
    display: block;
    height: 100%;
    background: var(--mint);
    border-radius: 0 999px 999px 0;
    transition: width 450ms cubic-bezier(.4, 0, .2, 1);
  }

  .totalrow { display: flex; justify-content: flex-end; padding: 20px 20px 0; flex: none; }
  .total {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 999px;
    background: var(--mint-dim);
    border: 1px solid var(--line);
    color: var(--mint);
  }
  .total .lbl { font-size: 0.875rem; opacity: 0.8; }
  .total .num { font-size: 1rem; font-variant-numeric: tabular-nums; }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
  }
  .col { width: 100%; max-width: 672px; }

  .fade { transition: opacity 190ms ease, transform 190ms ease; }
  .fade.out { opacity: 0; transform: translateY(14px); }

  /* ---- question ---------------------------------------------------- */

  .qhead { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .chip {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: var(--mint-dim);
    color: var(--mint);
    flex: none;
  }
  .step { font-size: 0.875rem; color: var(--mint); font-variant-numeric: tabular-nums; }

  h2 {
    margin: 0 0 8px;
    font-size: clamp(1.75rem, 5vw, 2.25rem);
    line-height: 1.15;
    font-weight: 600;
    letter-spacing: -0.02em;
    text-wrap: balance;
  }
  .sub { margin: 0 0 32px; font-size: 1.125rem; color: var(--fg-soft); }

  .stack { display: grid; gap: 12px; margin-bottom: 32px; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 32px; }

  /* ---- option row -------------------------------------------------- */

  .opt {
    display: flex;
    align-items: center;
    gap: 16px;
    width: 100%;
    padding: 16px;
    border-radius: 16px;
    text-align: left;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--fg);
    transition: background 160ms ease, border-color 160ms ease, transform var(--dur) cubic-bezier(.34, 1.56, .64, 1);
  }
  .opt:hover { background: var(--card-hover); }
  .opt.on {
    background: var(--mint);
    border-color: var(--mint);
    color: var(--ink);
  }
  .opt.pop { transform: scale(0.97); }

  .opt .ico {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border-radius: 12px;
    flex: none;
    background: var(--mint-dim);
    color: var(--mint);
  }
  .opt.on .ico { background: rgba(2, 44, 34, 0.12); color: var(--ink); }

  .opt .txt { flex: 1; min-width: 0; }
  .opt .lab { display: block; font-size: 1.125rem; }
  .opt .hint {
    display: block;
    font-size: 0.875rem;
    opacity: 0.65;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .key {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 8px;
    font-size: 0.75rem;
    flex: none;
    opacity: 0.85;
    border: 1px solid rgba(255, 255, 255, 0.25);
  }
  .opt.on .key { border-color: rgba(2, 44, 34, 0.35); }

  /* ---- bank tile --------------------------------------------------- */

  .tile {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 16px 12px;
    border-radius: 16px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--fg);
    transition: background 160ms ease, border-color 160ms ease, transform var(--dur) cubic-bezier(.34, 1.56, .64, 1);
  }
  .tile:hover { background: var(--card-hover); }
  .tile.on { border-color: var(--mint); background: var(--mint-dim); }
  .tile.pop { transform: scale(0.95); }
  .tile .name { font-size: 0.875rem; text-align: center; line-height: 1.2; }

  .tick {
    position: absolute;
    top: 8px;
    right: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    border-radius: 999px;
    background: var(--mint);
    color: var(--ink);
  }

  .logo {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    background: #fff;
    flex: none;
    overflow: hidden;
  }

  /* ---- buttons ----------------------------------------------------- */

  .row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }

  .go {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 24px;
    border-radius: 16px;
    font-size: 1.125rem;
    background: var(--mint);
    color: var(--ink);
    transition: transform var(--dur) cubic-bezier(.34, 1.56, .64, 1);
  }
  .go:hover { transform: translateY(-1px); }

  .ghost {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 24px;
    border-radius: 16px;
    font-size: 1.125rem;
    border: 1px solid var(--line);
  }
  .ghost:hover { background: var(--card); }

  .hintline { font-size: 0.875rem; color: var(--fg-faint); }
  @media (max-width: 640px) { .hintline { display: none; } }

  .back {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 0.875rem;
    color: var(--fg-faint);
  }
  .back:hover { color: var(--fg-soft); }

  /* ---- result ------------------------------------------------------ */

  .eyebrow { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; color: var(--mint); font-size: 0.875rem; }
  .sum {
    margin: 0 0 12px;
    font-size: clamp(3.25rem, 12vw, 4.5rem);
    line-height: 1;
    font-weight: 600;
    letter-spacing: -0.035em;
    font-variant-numeric: tabular-nums;
  }

  .offer {
    border-radius: 16px;
    padding: 16px;
    background: var(--card);
    border: 1px solid var(--line);
    animation: rise 420ms cubic-bezier(.4, 0, .2, 1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .offer { animation: none; } }

  .offer .top { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .offer .bank { flex: 1; font-size: 1.125rem; }
  .offer .amt { font-size: 1.25rem; white-space: nowrap; color: var(--mint); font-variant-numeric: tabular-nums; }
  .offer .note { margin: 0 0 16px; font-size: 0.875rem; color: var(--fg-faint); }
  .offer .foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .ok { display: inline-flex; align-items: center; gap: 6px; font-size: 0.875rem; color: var(--mint); }

  .cta {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    border-radius: 12px;
    background: var(--mint);
    color: var(--ink);
  }

  .fine { margin: 24px 0 0; font-size: 0.875rem; color: var(--fg-faint); }
  .again { margin-top: 16px; font-size: 0.875rem; color: var(--fg-faint); text-decoration: underline; }

  .demo {
    margin-top: 32px;
    padding: 12px 16px;
    border-radius: 12px;
    border: 1px dashed var(--line);
    font-size: 0.8125rem;
    color: var(--fg-faint);
    line-height: 1.5;
  }
</style>
</head>
<body>
<div class="bar"><i id="bar" style="width:0%"></i></div>
<div class="totalrow" id="totalrow" hidden>
  <div class="total">
    <span data-icon="coins" data-size="16"></span>
    <span class="lbl">zatím</span>
    <span class="num" id="total">0 Kč</span>
  </div>
</div>
<main><div class="col fade" id="view"></div></main>

<script>
  "use strict";

  /* ---- data (mirrors OFFERS in components/BonusQuiz.jsx) ------------ */

  const OFFERS = [
    { id: "airbank", bank: "Air Bank", short: "AB", tint: "#F97316", brand: "#EE7203", amount: 1500, requiresIncome: true, minCards: 5, note: "Příchozí platba od 15 000 Kč, 5 plateb kartou" },
    { id: "raiffeisen", bank: "Raiffeisenbank", short: "RB", tint: "#FACC15", brand: "#1A1A1A", amount: 2000, requiresIncome: true, minCards: 10, note: "Výplata na účet, 10 plateb kartou" },
    { id: "moneta", bank: "Moneta", short: "MO", tint: "#38BDF8", brand: "#0F4C8C", amount: 1200, requiresIncome: true, minCards: 0, note: "Příchozí platba od 10 000 Kč" },
    { id: "mbank", bank: "mBank", short: "mB", tint: "#FB7185", brand: "#C8102E", amount: 1000, requiresIncome: false, minCards: 5, note: "5 plateb kartou po dobu 2 měsíců" },
    { id: "csob", bank: "ČSOB", short: "ČS", tint: "#818CF8", brand: "#0033A0", amount: 800, requiresIncome: false, minCards: 10, note: "10 plateb kartou v prvním měsíci" },
    { id: "fio", bank: "Fio banka", short: "Fi", tint: "#4ADE80", brand: "#12824C", amount: 500, requiresIncome: false, minCards: 0, note: "Bez podmínek, stačí aktivovat účet" },
  ];

  const LETTERS = "ABCDEFGH".split("");

  const QUESTIONS = [
    {
      key: "age", type: "single", icon: "calendar",
      q: "Kolik ti je?", sub: "Podmínky odměn se liší podle věku.",
      options: [
        { value: "under18", label: "Pod 18" },
        { value: "18-25", label: "18–25" },
        { value: "26+", label: "26 a víc" },
      ],
    },
    {
      key: "owned", type: "banks", icon: "landmark",
      q: "Kde už máš účet?", sub: "Odměnu vyplácí banky jen novým klientům.",
      options: OFFERS.map((o) => ({ value: o.id, label: o.bank, short: o.short, brand: o.brand })),
    },
    {
      key: "count", type: "single", icon: "wallet",
      q: "Kolik účtů si chceš založit?", sub: "Odměny jde posbírat i u víc bank najednou.",
      options: [
        { value: 1, label: "Jeden", hint: "Chci jeden nový účet", icon: "wallet" },
        { value: 3, label: "Dva až tři", hint: "Zvládnu jich víc", icon: "coins" },
        { value: 99, label: "Kolik to jde", hint: "Jde mi hlavně o peníze", icon: "trending" },
      ],
    },
    {
      key: "income", type: "single", icon: "banknote",
      q: "Můžeš si nechat posílat výplatu na nový účet?", sub: "Většina vyšších odměn stojí na příchozí platbě.",
      options: [
        { value: "yes", label: "Ano", hint: "Výplatu tam přesunu", icon: "banknote" },
        { value: "partial", label: "Radši ne", hint: "Ale pár tisíc tam pošlu", icon: "coins" },
        { value: "no", label: "Ne", hint: "Výplatu nechci přesouvat", icon: "wallet" },
      ],
    },
    {
      key: "cards", type: "single", icon: "card",
      q: "Kolik plateb kartou zvládneš měsíčně?", sub: "Poslední otázka.",
      options: [
        { value: 4, label: "Do pěti", icon: "card" },
        { value: 9, label: "Pět až deset", icon: "card" },
        { value: 99, label: "Přes deset", icon: "card" },
      ],
    },
  ];

  function matchOffers(a) {
    const owned = a.owned || [];
    return OFFERS
      .filter((o) => !owned.includes(o.id))
      .filter((o) => (o.requiresIncome ? (a.income ?? "yes") !== "no" : true))
      .filter((o) => o.minCards <= (a.cards ?? 99))
      .sort((x, y) => y.amount - x.amount)
      .slice(0, (a.count ?? 99) === 99 ? 99 : a.count);
  }

  /* ---- icons (lucide isn't loadable under the artifact CSP) --------- */

  const ICONS = {
    calendar: '<rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 10h18M8 2.5v4M16 2.5v4"/>',
    landmark: '<path d="M2.5 10 12 3.5 21.5 10"/><path d="M4.5 10v8.5M9.5 10v8.5M14.5 10v8.5M19.5 10v8.5"/><path d="M2.5 20.5h19"/>',
    wallet: '<path d="M3.5 7.5v10A2.5 2.5 0 0 0 6 20h13a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2H6A2.5 2.5 0 0 1 6 4h11"/><circle cx="17" cy="14" r="1.15"/>',
    coins: '<circle cx="9" cy="9" r="5.5"/><circle cx="15" cy="15" r="5.5"/>',
    banknote: '<rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 10v4M18 10v4"/>',
    card: '<rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19M6.5 15h3"/>',
    trending: '<path d="M3 17l6-6 4 4 7-7"/><path d="M15 8h5v5"/>',
    check: '<path d="M4 12.5l5 5L20 6.5"/>',
    arrow: '<path d="M4 12h15"/><path d="M13 6l6 6-6 6"/>',
    chevron: '<path d="M15 5l-7 7 7 7"/>',
    sparkles: '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Z"/><path d="M19 15.5l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7.7-2Z"/>',
  };

  function icon(name, size, width) {
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" ' +
      'stroke="currentColor" stroke-width="' + (width || 1.75) + '" stroke-linecap="round" ' +
      'stroke-linejoin="round" aria-hidden="true">' + ICONS[name] + "</svg>";
  }

  // Same monogram the repo ships in public/logos/ — inlined because the
  // artifact CSP blocks every external request, including same-origin files.
  function logo(short, brand, size) {
    const inner = size - 14;
    return '<span class="logo" style="width:' + size + 'px;height:' + size + 'px">' +
      '<svg width="' + inner + '" height="' + inner + '" viewBox="0 0 64 64" aria-hidden="true">' +
      '<text x="32" y="33" fill="' + brand + '" font-family="' + "system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" + '" ' +
      'font-size="27" font-weight="700" letter-spacing="-1" text-anchor="middle" ' +
      'dominant-baseline="central">' + short + "</text></svg></span>";
  }

  const czk = (n) => n.toLocaleString("cs-CZ") + " Kč";
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  /* ---- state ------------------------------------------------------- */

  const view = document.getElementById("view");
  const bar = document.getElementById("bar");
  const totalRow = document.getElementById("totalrow");
  const totalEl = document.getElementById("total");

  let step = 0;
  let answers = { owned: [] };
  let popped = null;
  let shown = 0;
  let raf = 0;

  const total = QUESTIONS.length;
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function animateTo(el, to) {
    const from = shown;
    if (reduced || from === to) { shown = to; el.textContent = czk(to); return; }
    const t0 = performance.now();
    cancelAnimationFrame(raf);
    const tick = (now) => {
      const p = Math.min(1, (now - t0) / 700);
      const v = Math.round(from + (to - from) * (1 - Math.pow(1 - p, 3)));
      el.textContent = czk(v);
      if (p < 1) raf = requestAnimationFrame(tick);
      else shown = to;
    };
    raf = requestAnimationFrame(tick);
  }

  function go(next) {
    view.classList.add("out");
    setTimeout(() => { step = next; render(); view.classList.remove("out"); }, reduced ? 0 : 190);
  }

  function pick(q, value) {
    popped = String(value);
    setTimeout(() => { popped = null; render(); }, 220);
    if (navigator.vibrate) navigator.vibrate(8);

    if (q.type === "banks") {
      const list = answers[q.key] || [];
      answers[q.key] = list.includes(value) ? list.filter((v) => v !== value) : list.concat([value]);
      render();
    } else {
      answers[q.key] = value;
      render();
      if (value !== "under18") setTimeout(() => go(step + 1), 160);
    }
  }

  function reset() {
    step = 0;
    answers = { owned: [] };
    shown = 0;
    render();
  }

  /* ---- render ------------------------------------------------------ */

  function render() {
    const done = step >= total;
    const under18 = answers.age === "under18";
    const cur = done ? null : QUESTIONS[step];

    bar.style.width = (under18 ? 20 : done ? 100 : (step / total) * 100) + "%";

    const running = matchOffers(answers).reduce((s, o) => s + o.amount, 0);
    const showTotal = !done && !under18 && step >= 1;
    totalRow.hidden = !showTotal;
    if (showTotal) animateTo(totalEl, running);

    if (under18) return renderUnder18();
    if (done) return renderResult();
    return renderQuestion(cur);
  }

  function renderUnder18() {
    view.innerHTML =
      '<span class="chip" style="width:56px;height:56px;border-radius:16px;margin-bottom:24px">' + icon("calendar", 26) + "</span>" +
      "<h2>Odměny za účet jsou až od 18 let</h2>" +
      '<p class="sub" style="margin-bottom:12px">Banky platí jen lidem, kteří můžou smlouvu podepsat sami. ' +
      "Do osmnácti si účet založit můžeš, ale potřebuješ k tomu rodiče — a takový účet odměnu nenese.</p>" +
      '<p class="sub">Sepsali jsme, které účty od 15 let stojí za to a co k založení potřebuješ.</p>' +
      '<div class="row">' +
      '<button class="go" data-act="minors">Účty od 15 let ' + icon("arrow", 18, 2) + "</button>" +
      '<button class="ghost" data-act="reset">' + icon("chevron", 18, 2) + " Zpátky</button>" +
      "</div>" +
      '<p class="demo">Ukázka běží samostatně, takže odkaz na článek o účtech od 15 let nikam nevede. ' +
      "V aplikaci míří na <code>/ucty-pro-mladsi-18</code>.</p>";
    bind();
  }

  function renderQuestion(cur) {
    const selected = cur.type === "banks" ? (answers[cur.key] || []) : [answers[cur.key]];
    let html =
      '<div class="qhead"><span class="chip">' + icon(cur.icon, 20) + "</span>" +
      '<span class="step">' + (step + 1) + " → " + total + "</span></div>" +
      "<h2>" + esc(cur.q) + "</h2>" +
      '<p class="sub">' + esc(cur.sub) + "</p>";

    if (cur.type === "banks") {
      html += '<div class="tiles">' + cur.options.map((o) => {
        const on = selected.includes(o.value);
        return '<button class="tile' + (on ? " on" : "") + (popped === String(o.value) ? " pop" : "") + '"' +
          ' data-val="' + esc(o.value) + '" aria-pressed="' + on + '">' +
          logo(o.short, o.brand, 48) +
          '<span class="name">' + esc(o.label) + "</span>" +
          (on ? '<span class="tick">' + icon("check", 12, 3) + "</span>" : "") +
          "</button>";
      }).join("") + "</div>";
    } else {
      html += '<div class="stack">' + cur.options.map((o, i) => {
        const on = selected.includes(o.value);
        return '<button class="opt' + (on ? " on" : "") + (popped === String(o.value) ? " pop" : "") + '"' +
          ' data-val="' + esc(o.value) + '">' +
          (o.icon ? '<span class="ico">' + icon(o.icon, 20) + "</span>" : "") +
          '<span class="txt"><span class="lab">' + esc(o.label) + "</span>" +
          (o.hint ? '<span class="hint">' + esc(o.hint) + "</span>" : "") + "</span>" +
          '<span class="key">' + (on ? icon("check", 14, 2.5) : LETTERS[i]) + "</span>" +
          "</button>";
      }).join("") + "</div>";
    }

    const canAdvance = cur.type === "banks" || answers[cur.key] !== undefined;
    html += '<div class="row">' +
      (canAdvance
        ? '<button class="go" data-act="next">' +
          (cur.type === "banks" && selected.length === 0 ? "Nemám ani jeden" : "OK") +
          " " + icon("arrow", 18, 2) + "</button>"
        : "") +
      '<span class="hintline">nebo stiskni <strong>Enter ↵</strong></span>' +
      (step > 0 ? '<button class="back" data-act="prev">' + icon("chevron", 15, 2) + " Zpět</button>" : "") +
      "</div>";

    view.innerHTML = html;
    bind();
  }

  function renderResult() {
    const matched = matchOffers(answers);
    const sum = matched.reduce((s, o) => s + o.amount, 0);

    let html =
      '<div class="eyebrow">' + icon("sparkles", 16, 2) + "<span>Tvůj výsledek</span></div>" +
      '<p class="sum" id="sum">' + czk(0) + "</p>" +
      '<p class="sub">' + (matched.length === 0
        ? "Na tvoje podmínky zatím nesedí žádná nabídka. Zkus povolit víc plateb kartou."
        : "Tolik můžeš získat u " + matched.length + " " + (matched.length === 1 ? "banky" : "bank") + ".") +
      "</p>";

    html += '<div class="stack">' + matched.map((o, i) =>
      '<div class="offer" style="animation-delay:' + (i * 90) + 'ms">' +
      '<div class="top">' + logo(o.short, o.brand, 44) +
      '<span class="bank">' + esc(o.bank) + "</span>" +
      '<span class="amt">' + czk(o.amount) + "</span></div>" +
      '<p class="note">' + esc(o.note) + "</p>" +
      '<div class="foot"><span class="ok">' + icon("check", 15, 2.5) + " Splňuješ podmínky</span>" +
      '<button class="cta" data-act="offer">Získat odměnu ' + icon("arrow", 16, 2) + "</button></div></div>"
    ).join("") + "</div>";

    html += '<p class="fine">Odkazy na banky jsou partnerské. Pořadí určuje výše odměny, ne provize.</p>' +
      '<button class="again" data-act="reset">Projít znovu</button>' +
      '<p class="demo">Ukázka běží samostatně, takže tlačítka „Získat odměnu“ nikam nevedou — ' +
      "v aplikaci míří na <code>/go/&lt;id&gt;</code> s <code>rel=\"sponsored nofollow\"</code>. " +
      "Loga jsou zatím monogramy z <code>public/logos/</code>, ne oficiální soubory bank.</p>";

    view.innerHTML = html;
    shown = 0;
    animateTo(document.getElementById("sum"), sum);
    bind();
  }

  /* ---- events ------------------------------------------------------ */

  function bind() {
    view.querySelectorAll("[data-val]").forEach((el) => {
      el.addEventListener("click", () => {
        const cur = QUESTIONS[step];
        const raw = el.getAttribute("data-val");
        const opt = cur.options.find((o) => String(o.value) === raw);
        if (opt) pick(cur, opt.value);
      });
    });

    view.querySelectorAll("[data-act]").forEach((el) => {
      el.addEventListener("click", () => {
        const act = el.getAttribute("data-act");
        if (act === "next") go(step + 1);
        else if (act === "prev") go(step - 1);
        else if (act === "reset") reset();
      });
    });
  }

  window.addEventListener("keydown", (e) => {
    if (step >= total || answers.age === "under18") return;
    const cur = QUESTIONS[step];
    if (e.key === "Enter") {
      if (cur.type === "banks" || answers[cur.key] !== undefined) go(step + 1);
      return;
    }
    if (e.key.length !== 1) return;
    const idx = LETTERS.indexOf(e.key.toUpperCase());
    if (idx >= 0 && idx < cur.options.length) pick(cur, cur.options[idx].value);
  });

  render();
</script>
</body>
</html>
