  :root {
    --bg: #04352A;
    --card: rgba(255, 255, 255, 0.06);
    --card-hover: rgba(255, 255, 255, 0.10);
    --line: rgba(255, 255, 255, 0.16);
    --mint: #5EEAD4;
    --mint-dim: rgba(94, 234, 212, 0.14);
    --ink: #022C22;
    --fg: #FFFFFF;
    --fg-soft: rgba(255, 255, 255, 0.72);
    --fg-faint: rgba(255, 255, 255, 0.55);
    --ui: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    --display: "Bricolage Grotesque", var(--ui);
    --mascot-w: clamp(380px, 40vw, 620px);

    /* Zaoblení tlačítek. Stejná hodnota jako CTA v hero na úvodní
       stránce, ať se ovládací prvky napříč webem chovají stejně. */
    --r-btn: 16px;

    /* Pohyb má jednu rodinu křivek a tři délky. Dojem plynulosti nedělá delší
       animace, ale to, že všechno dojíždí stejným způsobem, že se hýbou jen
       transform a opacity (prohlížeč je skládá na GPU a nepřepočítává kvůli
       nim rozvržení) a že odchod je vždycky kratší než příchod.
         --ease     rychlý rozjezd, dlouhé měkké dojetí — pro příchody
         --ease-io  symetrická, pro překreslení na místě (barvy, šířky)
         --ease-pop lehké přejetí přes cíl, jen pro potvrzení výběru */
    --ease: cubic-bezier(.22, 1, .36, 1);
    --ease-io: cubic-bezier(.4, 0, .2, 1);
    --ease-pop: cubic-bezier(.34, 1.4, .64, 1);
    --t-fast: 140ms;
    --t-base: 260ms;
    --t-slow: 420ms;
    --dur: 220ms;
  }

  /* Vypnout se musí i délky, ne jen jednotlivé animace: jinak by zůstaly
     přechody, které si berou dobu z proměnných. */
  @media (prefers-reduced-motion: reduce) {
    :root { --dur: 1ms; --t-fast: 1ms; --t-base: 1ms; --t-slow: 1ms; }
  }

  * { box-sizing: border-box; }

  /* display:flex below would otherwise win over the hidden attribute */
  [hidden] { display: none !important; }

  /* Plochá zeleň působila jako papír. Jemné světlo shora dá stránce hloubku
     a drží pozornost tam, kde je částka — bez gradientového hero, které by
     tenhle typ stránky srazilo do šablony. */
  body {
    margin: 0;
    min-height: 100vh;
    background-color: var(--bg);
    background-image:
      radial-gradient(90% 55% at 50% 0%, rgba(94, 234, 212, 0.13), transparent 62%),
      radial-gradient(70% 45% at 88% 8%, rgba(94, 234, 212, 0.07), transparent 70%);
    background-repeat: no-repeat;
    color: var(--fg);
    font-family: var(--ui);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }

  button, a { font: inherit; color: inherit; }
  button { border: 0; background: none; cursor: pointer; }

  /* Bez border-radius: ta vlastnost tady měnila poloměr rohů samotného
     prvku, takže karta při zaostření skočila z 16 px na 4 px. Obrys sleduje
     vlastní zaoblení prvku sám. */
  :focus-visible {
    outline: 2px solid var(--mint);
    outline-offset: 3px;
  }

  /* ---- shell ------------------------------------------------------- */

  .bar { height: 4px; width: 100%; background: rgba(255, 255, 255, 0.12); flex: none; }
  /* Pruh roste přes scaleX, ne přes width: šířka je rozvržení, které se musí
     přepočítat každý snímek, kdežto transform jede na GPU. Na čtyřech pixelech
     výšky se zploštění zaobleného konce nepozná. */
  .bar > i {
    display: block;
    width: 100%;
    height: 100%;
    background: var(--mint);
    border-radius: 0 999px 999px 0;
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform 520ms var(--ease);
  }

  .totalrow { display: flex; justify-content: flex-end; padding: 20px 20px 0; flex: none; }
  .total {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 999px;
    background: var(--mint-dim);
    border: 1px solid var(--line);
    color: var(--mint);
  }
  .total #totalicon { display: inline-flex; }
  .total .lbl { font-size: 0.875rem; opacity: 0.8; }
  .total .num { font-family: var(--display); font-size: 1rem; font-variant-numeric: tabular-nums; }

  /* Maskot je dekorace: sedí ve volném pruhu vpravo, nereaguje na myš a pro
     odečítače neexistuje. Pod 1100 px zmizí — tam už by lezl do textu. */
  .mascot {
    position: fixed;
    right: 0;
    bottom: 0;
    /* Velikost podle šířky, ne podle výšky: pruh vpravo se rezervuje taky
       na šířku a při jiném poměru stran obrázku se ty dvě míry rozejdou —
       obrázek pak přeteče do textu. max-height drží maskota v okně i na
       nízkých displejích, object-position ho tam ukotví vpravo dole. */
    width: var(--mascot-w);
    height: auto;
    max-height: 96vh;
    object-fit: contain;
    object-position: right bottom;
    pointer-events: none;
    user-select: none;
    opacity: 0;
    animation: mascot 700ms var(--ease) 260ms forwards;
  }
  @keyframes mascot {
    from { opacity: 0; transform: translateX(24px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .mascot { animation: none; opacity: 1; }
  }
  main {
    position: relative;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    /* Svisle víc vzduchu než po stranách: kvíz pak stojí uprostřed plochy,
       ne nalepený mezi horní a dolní hranu. */
    padding: 80px 20px;
  }
  /* Otázky zůstávají v úzkém sloupci — text delší než zhruba 70 znaků se čte
     hůř a odpovědi pod sebou se prolítnou očima rychleji než rozházené po
     šířce. Výsledek je ale seznam karet, ne text: tam úzký sloupec nechává
     půlku obrazovky prázdnou a nutí rolovat přes všechny nabídky. */
  .col { width: 100%; max-width: 672px; }
  .col.wide { max-width: 1180px; }

  /* Nad tímhle prahem se úvod chová jako dva sloupce: text vlevo, strom
     vpravo. Bez odsazení by veverka ležela na textu. Pod prahem není na dva
     sloupce místo, takže strom mizí a text se zase vystředí. */
  @media (max-width: 1239px) { .mascot { display: none; } }
  @media (min-width: 1240px) {
    /* Vlevo stejný vzduch jako uvnitř bloku, ne zbytek po odsazení vpravo.
       Pruh se rezervuje jen tam, kde maskot opravdu stojí — jinak by otázky
       i výsledek byly natlačené doleva kvůli obrázku, který na nich není. */
    main.with-mascot { padding-left: clamp(48px, 6vw, 96px); padding-right: var(--mascot-w); }
  }

  /* Výměna obrazovky má dva různé konce. Odcházející obsah stoupá a mizí
     rychle — vyprovázet ho nemá cenu. Nový přijíždí zdola, déle a měkčeji.
     Bez toho `.in` by nový obsah dojel z pozice toho starého, tedy shora,
     a celý kvíz by se posouval jedním směrem jako pás. */
  .fade {
    transition: opacity var(--t-base) var(--ease), transform var(--t-base) var(--ease);
  }
  .fade.out {
    opacity: 0;
    transform: translateY(-10px) scale(0.99);
    transition-duration: var(--t-fast);
  }
  .fade.in { opacity: 0; transform: translateY(12px); transition: none; }

  /* ---- question ---------------------------------------------------- */

  .qhead { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }

  /* Šest čárek místo „3 → 6". Otázky jsou opravdu posloupnost pevné délky,
     takže se dá ukázat i kolik ještě zbývá — číslo to neřeklo. */
  .pips { display: flex; align-items: center; gap: 5px; }
  .pips i {
    display: block;
    width: 18px;
    height: 4px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.2);
    transition: background var(--t-base) var(--ease-io), width var(--t-base) var(--ease);
  }
  .pips i.done { background: rgba(94, 234, 212, 0.45); }
  .pips i.now { width: 30px; background: var(--mint); }
  .chip {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: var(--mint-dim);
    color: var(--mint);
    flex: none;
  }
  .step { font-size: 0.875rem; color: var(--mint); font-variant-numeric: tabular-nums; }

  h2 {
    margin: 0 0 8px;
    font-family: var(--display);
    font-size: clamp(1.75rem, 5vw, 2.25rem);
    line-height: 1.1;
    font-weight: 600;
    letter-spacing: -0.02em;
    text-wrap: balance;
  }
  .sub { margin: 0 0 32px; font-size: 1.125rem; color: var(--fg-soft); }

  .stack { display: grid; gap: 12px; margin-bottom: 32px; }

  /* Dva sloupce na úzkých displejích: „Raiffeisenbank" se nezalomí a jako
     grid item s výchozím min-width:auto roztlačí sloupec i celou stránku
     do strany. Proto i to min-width:0 a lámání na dlouhých názvech níž. */
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 32px; }
  @media (max-width: 460px) { .tiles { grid-template-columns: repeat(2, 1fr); } }

  /* ---- option row -------------------------------------------------- */

  .opt {
    display: flex;
    align-items: center;
    gap: 16px;
    width: 100%;
    padding: 16px;
    border-radius: var(--r-btn);
    text-align: left;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--fg);
    /* Barvy se překreslují na místě, proto symetrická křivka; pohyb pod prstem
       má vlastní, aby stisk odskočil zpátky a nedojížděl líně. */
    transition: background var(--t-fast) var(--ease-io),
                border-color var(--t-fast) var(--ease-io),
                transform var(--t-fast) var(--ease-pop);
  }
  .opt:hover { background: var(--card-hover); border-color: rgba(255, 255, 255, 0.3); }
  /* Stisk je jediná odezva, kterou dostane člověk dřív, než stihne cokoli
     spočítat — proto se hýbe už při zmáčknutí, ne až po výběru. */
  .opt:active { transform: scale(0.985); }
  .opt.on {
    background: var(--mint);
    border-color: var(--mint);
    color: var(--ink);
  }
  .opt.pop { animation: pop var(--dur) var(--ease-pop); }

  .opt .ico {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border-radius: 12px;
    flex: none;
    background: var(--mint-dim);
    color: var(--mint);
  }
  .opt.on .ico { background: rgba(2, 44, 34, 0.12); color: var(--ink); }

  .opt .txt { flex: 1; min-width: 0; }
  .opt .lab { display: block; font-size: 1.125rem; }
  .opt .hint {
    display: block;
    font-size: 0.875rem;
    opacity: 0.65;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .key {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 8px;
    font-size: 0.75rem;
    flex: none;
    opacity: 0.85;
    border: 1px solid rgba(255, 255, 255, 0.25);
  }
  .opt.on .key { border-color: rgba(2, 44, 34, 0.35); }

  /* ---- bank tile --------------------------------------------------- */

  .tile {
    position: relative;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 16px 12px;
    border-radius: var(--r-btn);
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--fg);
    transition: background var(--t-fast) var(--ease-io),
                border-color var(--t-fast) var(--ease-io),
                transform var(--t-fast) var(--ease-pop);
  }
  .tile:hover { background: var(--card-hover); border-color: rgba(255, 255, 255, 0.3); }
  .tile:active { transform: scale(0.985); }
  .tile.on { border-color: var(--mint); background: var(--mint-dim); }
  .tile.pop { animation: pop var(--dur) var(--ease-pop); }

  /* Nabídka se rozjíždí po řadě, ne najednou — oko pak stihne přečíst pořadí.
     Třídu dostanou dlaždice jen při změně kroku, ne při každém překreslení:
     po kliknutí se překresluje celý seznam a jinak by se rozjel znovu. */
  /* Výplň je backwards, ne both: kdyby po doběhnutí zůstal koncový snímek
     (transform: none), přebil by zmenšení při stisku a tlačítko by přestalo
     reagovat na prst, dokud se seznam nepřekreslí. */
  .opt.enter, .tile.enter { animation: rise var(--t-slow) var(--ease) backwards; }
  @media (prefers-reduced-motion: reduce) {
    .opt.enter, .tile.enter { animation: none; }
  }
  .tile .name {
    min-width: 0;
    font-size: 0.875rem;
    text-align: center;
    line-height: 1.2;
    overflow-wrap: anywhere;
  }

  .tick {
    position: absolute;
    top: 8px;
    right: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    border-radius: 999px;
    background: var(--mint);
    color: var(--ink);
  }

  /* Zaoblený čtverec, ne kolečko — loga bank jsou čtvercové ikony a mBank
     s Monetou mají barvu až do rohů, které by kolečko odřízlo. */
  .logo {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    background: #fff;
    flex: none;
    overflow: hidden;
  }
  .logo img { display: block; object-fit: contain; }

  /* ---- buttons ----------------------------------------------------- */

  .row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }

  .go {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 24px;
    border-radius: var(--r-btn);
    font-size: 1.125rem;
    background: var(--mint);
    color: var(--ink);
    transition: transform var(--t-fast) var(--ease-pop), background var(--t-fast) var(--ease-io);
  }
  .go:hover { transform: translateY(-1px); }
  .go:active { transform: scale(0.97); }

  .ghost {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 24px;
    border-radius: var(--r-btn);
    font-size: 1.125rem;
    border: 1px solid var(--line);
  }
  .ghost {
    transition: transform var(--t-fast) var(--ease-pop), background var(--t-fast) var(--ease-io);
  }
  .ghost:hover { background: var(--card); }
  .ghost:active { transform: scale(0.97); }

  .hintline { font-size: 0.875rem; color: var(--fg-faint); }
  @media (max-width: 640px) { .hintline { display: none; } }

  .back {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 0.875rem;
    color: var(--fg-faint);
  }
  .back:hover { color: var(--fg-soft); }

  /* ---- result ------------------------------------------------------ */

  .eyebrow { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; color: var(--mint); font-size: 0.875rem; }
  .sum {
    margin: 0 0 20px;
    font-family: var(--display);
    font-size: clamp(3.25rem, 12vw, 4.5rem);
    line-height: 1;
    font-weight: 700;
    letter-spacing: -0.04em;
    font-variant-numeric: tabular-nums;
  }
  /* Bílá je celý bank na úvodu, mátová je to, co je tvoje. Stejnou barvou
     svítí i částky u jednotlivých nabídek, takže to drží pohromadě. */
  .sum.mine { color: var(--mint); }

  /* Ve výsledku maskot nemůže být fixed jako v úvodu: výsledek se roluje a
     přišpendlená veverka by přejížděla přes nabídky. Stojí tedy vedle částky,
     v toku — a jen když nějaká odměna vyšla; nad prázdným výsledkem by jásala
     nad ničím. Poměr stran drží aspect-ratio, takže si místo zabere hned a
     částka pod ním neposkočí, až se obrázek načte. */
  .win { display: grid; gap: 16px; justify-items: center; margin-bottom: 32px; }
  .win .sum { margin-bottom: 12px; }
  .win .sub { margin-bottom: 0; }
  .cheer {
    display: block;
    width: clamp(150px, 22vw, 280px);
    aspect-ratio: 719 / 760;
    animation: cheer 620ms var(--ease-pop) 420ms both;
  }
  .cheer img { display: block; width: 100%; height: 100%; object-fit: contain; }
  @keyframes cheer {
    from { opacity: 0; transform: scale(0.84) translateY(12px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) { .cheer { animation: none; } }
  /* Vedle sebe až tam, kde na částku i veverku zbude šířka. Pod prahem jde
     veverka pod text, ne vedle něj zmenšená na nečitelno.
     Sloupce jsou auto, ne 1fr: veverka má stát hned vedle částky. Přes celou
     šířku by ji od textu odtrhla prázdná plocha a hlavička by se rozpadla na
     dva nesouvisející rohy. */
  @media (min-width: 560px) {
    .win {
      grid-template-columns: auto auto;
      justify-content: start;
      justify-items: start;
      align-items: center;
      gap: clamp(24px, 4vw, 56px);
    }
  }

  .offer {
    border-radius: 16px;
    padding: 16px;
    background: var(--card);
    border: 1px solid var(--line);
    animation: rise var(--t-slow) var(--ease) both;
  }
  @keyframes pop { 0% { transform: scale(1); } 45% { transform: scale(0.96); } 100% { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .opt.pop, .tile.pop { animation: none; } }

  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .offer { animation: none; } }

  /* Nejvyšší bonus je jediná, kterou většina lidí vezme — dostane rámeček
     a štítek. Když je nabídka jen jedna, není co odlišovat a štítek se
     nevykresluje. */
  .offer.best { border-color: var(--mint); background: var(--mint-dim); }
  .best .flag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 12px;
    font-size: 0.6875rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--mint);
  }

  /* V mřížce jsou karty v řadě stejně vysoké, ale poznámky různě dlouhé.
     Bez tohohle by tlačítka v jedné řadě skákala nahoru a dolů podle délky
     textu nad nimi; margin-top: auto je srovná na spodní hranu. */
  .wide .offers { grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); }
  .wide .svcs { grid-template-columns: repeat(auto-fill, minmax(440px, 1fr)); }
  .offers .offer { display: flex; flex-direction: column; }
  .offers .offer .foot { margin-top: auto; }
  /* Nejvyšší bonus drží celou šířku: je to ta jediná, kterou většina lidí
     vezme, a v mřížce by zapadla mezi ostatní jako kterákoli jiná karta. */
  .offers .offer.best { grid-column: 1 / -1; }

  .offer .top { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .offer .bank { flex: 1; font-size: 1rem; }
  .offer .amt { font-family: var(--display); font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; white-space: nowrap; color: var(--mint); font-variant-numeric: tabular-nums; }
  .offer .note { margin: 0 0 16px; font-size: 0.875rem; color: var(--fg-faint); }
  .offer .foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .ok { display: inline-flex; align-items: center; gap: 6px; font-size: 0.875rem; color: var(--mint); }

  .cta {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    border-radius: var(--r-btn);
    background: var(--mint);
    color: var(--ink);
    transition: transform var(--t-fast) var(--ease-pop);
  }
  .cta:active { transform: scale(0.97); }

  /* ---- služby ------------------------------------------------------ */

  .svcblock { margin-top: 40px; padding-top: 32px; border-top: 1px solid var(--line); }
  .svcblock h3 {
    margin: 0 0 8px;
    font-family: var(--display);
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .svclead { margin: 0 0 20px; font-size: 0.875rem; color: var(--fg-faint); }

  .svc {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px;
    border-radius: 16px;
    background: var(--card);
    border: 1px solid var(--line);
  }
  .svc .txt { flex: 1; min-width: 0; }
  .svc .lab { display: block; }
  .svc .tag {
    margin-left: 8px;
    font-size: 0.6875rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--mint);
  }
  .svc .note { display: block; font-size: 0.875rem; color: var(--fg-faint); }
  .try {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: var(--r-btn);
    font-size: 0.875rem;
    flex: none;
    border: 1px solid var(--line);
    color: var(--mint);
    transition: transform var(--t-fast) var(--ease-pop), background var(--t-fast) var(--ease-io);
  }
  .try:active { transform: scale(0.97); }
  .try:hover { background: var(--card-hover); }
  @media (max-width: 520px) {
    .svc { flex-wrap: wrap; }
    .svc .try { margin-left: auto; }
  }

  .empty {
    padding: 24px;
    border-radius: 16px;
    border: 1px dashed var(--line);
    margin-bottom: 32px;
  }
  .empty p { margin: 0 0 20px; color: var(--fg-soft); }

  .fine { margin: 24px 0 0; font-size: 0.875rem; color: var(--fg-faint); }
  .again { margin-top: 16px; font-size: 0.875rem; color: var(--fg-faint); text-decoration: underline; }

  /* ---- intro ------------------------------------------------------- */

  /* Vertikální rytmus úvodu drží výhradně margin-bottom, jedna hodnota
     u jednoho elementu:
       eyebrow                16
       „Banky teď rozdávají"   8
       částka                 24
       nadpis                 16
       popis                  32
       řada log               32  (mezera mezi logy 12, dělá ji flex gap)
       řádek s tlačítkem      12  (pod ním footnote)
     Obaly proto nemají gap — o mezeru se stará vždycky element nad ní a nic
     se nesčítá.

     Nulování musí sáhnout i do obalů, ne jen na přímé potomky: .sum, .sub
     i .fine si nesou vlastní margin z bloku výsledku a odstavce navíc výchozí
     margin prohlížeče. Reset stojí před hodnotami, takže ho stejně specifická
     pravidla níž přebijí pořadím. */
  .intro { display: grid; padding-bottom: 32px; }
  .intro > *,
  .intro .hero > *,
  .intro .pitch > *,
  .intro .close > * { margin: 0; }

  .intro .hero,
  .intro .pitch,
  .intro .close { display: grid; }

  .intro .eyebrow { margin-bottom: 16px; }
  .intro .hero .lead { margin-bottom: 8px; font-size: 1.125rem; color: var(--fg-soft); }
  .intro .hero .sum { margin-bottom: 24px; }
  .intro .pitch h2 { margin-bottom: 16px; }
  .intro .pitch .sub { margin-bottom: 32px; max-width: 60ch; }
  .intro .logorow { margin-bottom: 32px; }
  .intro .close .row { margin-bottom: 12px; }
  .intro .close { justify-items: start; }

  .logorow { display: flex; flex-wrap: wrap; gap: 12px; }
  .logorow .logo { opacity: 0.9; }

  .intro > * { animation: rise 520ms var(--ease) both; }
  .intro > :nth-child(1) { animation-delay: 60ms; }
  .intro > :nth-child(2) { animation-delay: 140ms; }
  .intro > :nth-child(3) { animation-delay: 220ms; }
  .intro > :nth-child(4) { animation-delay: 300ms; }
  @media (prefers-reduced-motion: reduce) { .intro > * { animation: none; } }

</style>
</head>

  // Stejné soubory, jaké repo veze v public/logos/, jen zapečené do data URI —
  // artifact CSP blokuje každý požadavek ven, včetně souborů ze stejné adresy.
  // Název banky stojí vždycky vedle loga, takže alt zůstává prázdný.
  // Dlaždice je na šířku v poměru 4:3, ne čtverec. Loga bank jsou z půlky
  // wordmarky (Air Bank 2,5:1, Fio 1,4:1) a ve čtverci vycházely opticky
  // o dost menší než čtvercové značky, které ho vyplní celý.
  function logo(id, h) {
    const w = Math.round(h * 4 / 3);
    return '<span class="logo" style="width:' + w + 'px;height:' + h + 'px">' +
      '<img src="' + LOGOS[id] + '" alt="" width="' + (w - 12) + '" height="' + (h - 14) + '"></span>';
  }

  const otazek = (n) => (n === 1 ? "otázku" : n < 5 ? "otázky" : "otázek");
  const czk = (n) => n.toLocaleString("cs-CZ") + " Kč";
  // Čeština má tři tvary: 1 / 2–4 / 5 a víc. Dvě větve („jedna" a „ostatní")
  // nestačí — dvojka i trojka vyjdou v prázdném výsledku úplně běžně.
  const plural = (n, one, few, many) => (n === 1 ? one : n >= 2 && n <= 4 ? few : many);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  const total = QUESTIONS.length;
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Výchozí hodnotu si drží sám element, ne globální proměnná: běžící součet
  // nahoře a výsledná částka jsou dvě různá čísla a se sdíleným stavem
  // dopočítávalo jedno z cizí hodnoty.
  function animateTo(el, to) {
    const from = Number(el.dataset.shown || 0);
    if (reduced || from === to) { el.dataset.shown = to; el.textContent = czk(to); return; }
    const t0 = performance.now();
    cancelAnimationFrame(raf);
    // Čtvrtá mocnina místo třetí a o něco delší doba: číslo vyletí a poslední
    // stovky dopadají pomalu, takže se dají přečíst. Krátký lineárnější dojezd
    // vypadá jako přeblikávání číslic.
    const tick = (now) => {
      const p = Math.min(1, (now - t0) / 820);
      const v = Math.round(from + (to - from) * (1 - Math.pow(1 - p, 4)));
      el.textContent = czk(v);
      if (p < 1) raf = requestAnimationFrame(tick);
      else el.dataset.shown = to;
    };
    raf = requestAnimationFrame(tick);
  }

  // Odchod trvá --t-fast; tady musí sedět stejné číslo, jinak se obsah vymění
  // dřív, než stará obrazovka zmizí, nebo naopak čeká na prázdné ploše.
  const EXIT = 140;

  function go(next) {
    clearPending();
    popped = null;
    view.classList.add("out");
    setTimeout(() => {
      step = next;
      render();
      // Nový obsah se posadí dolů ještě bez přechodu, teprve pak se pustí
      // nahoru. Bez toho by dojel z pozice odcházejícího, tedy shora.
      view.classList.add("in");
      view.classList.remove("out");
      void view.offsetWidth;
      view.classList.remove("in");
    }, reduced ? 0 : EXIT);
  }

  function pick(q, value) {
    clearPending();
    popped = String(value);
    popTimer = setTimeout(() => { popped = null; render(); }, 220);
    if (navigator.vibrate) navigator.vibrate(8);

    if (isMulti(q)) {
      const list = answers[q.key] || [];
      answers[q.key] = list.includes(value) ? list.filter((v) => v !== value) : list.concat([value]);
      render();
    } else {
      answers[q.key] = value;
      render();
      // Než otázka odejde, ať je zaškrtnutí vidět celé: pop trvá 220 ms.
      if (value !== "under18") advance = setTimeout(() => go(step + 1), 320);
    }
  }

  function reset() {
    clearPending();
    step = INTRO;
    answers = BLANK();
    popped = null;
    totalEl.dataset.shown = 0;
    render();
  }

  /* ---- render ------------------------------------------------------ */

  function render() {
    const intro = step === INTRO;
    const done = step >= total;
    const under18 = answers.age === "under18";
    const cur = intro || done ? null : QUESTIONS[step];

    const progress = intro ? 0 : under18 ? 20 : done ? 100 : (step / total) * 100;
    bar.style.transform = "scaleX(" + progress / 100 + ")";

    const running = matchOffers(answers).reduce((s, o) => s + o.amount, 0);
    const showTotal = !intro && !done && !under18 && step >= FIRST_SCORING;
    totalRow.hidden = !showTotal;
    if (showTotal) animateTo(totalEl, running);

    // Maskot v pruhu vpravo patří jen k úvodu; u otázek by soutěžil s obsahem.
    // S ním se zapíná i odsazení, které mu ten pruh drží.
    mascot.hidden = !intro;
    main.classList.toggle("with-mascot", intro);

    // Široký sloupec jen tam, kde je co rozložit: výsledek s nabídkami. Úvod
    // a otázky jsou text, ten se čte v úzkém sloupci líp.
    view.classList.toggle("wide", done && matchOffers(answers).length > 0);

    // Odchodem z otázek se zapomene, co bylo vykreslené — po návratu se
    // odpovědi mají rozjet znovu, ne se objevit natvrdo.
    if (intro || under18 || done) renderedStep = null;

    if (intro) return renderIntro();
    if (under18) return renderUnder18();
    if (done) return renderResult();
    return renderQuestion(cur);
  }

  // Částka v úvodu je součet OFFERS, ne kulaté číslo natvrdo — když se nabídka
  // změní, slib na první obrazovce se změní s ní.
  function renderIntro() {
    view.innerHTML =
      '<div class="intro">' +
      // Čtyři skupiny, ne osm samostatných prvků: rytmus pak dělá gap, ne
      // marginy, které se sčítají.
      '<div class="hero">' +
      '<div class="eyebrow">' + icon("sparkles", 16) + "<span>Bonusy za registraci</span></div>" +
      '<p class="lead">Banky teď rozdávají dohromady</p>' +
      '<p class="sum">' + czk(POT) + "</p></div>" +
      // Počet otázek se počítá, ne opisuje — už se posunul z pěti na sedm.
      '<div class="pitch"><h2>Kolik z toho je pro tebe?</h2>' +
      '<p class="sub">Ber všechny, na které dosáhneš. Odpověz na ' + total + " " + otazek(total) +
      " a poskládáme ti z bonusů nejvyšší možnou částku a poradíme, " +
      "co si kde pohlídat, aby ti žádný neutekl.</p></div>" +
      '<div class="logorow">' + OFFERS.map((o) => logo(o.id, 48)).join("") + "</div>" +
      '<div class="close"><div class="row">' +
      '<button class="go" data-act="start">Zjistit, na co dosáhnu ' + icon("arrow", 18) + "</button>" +
      '<span class="hintline">nebo stiskni <strong>Enter ↵</strong></span>' +
      "</div>" +
      '<p class="fine">Necelá minuta. Bez jména, bez e-mailu.</p>' +
      "</div></div>";
    bind();
  }

  function renderUnder18() {
    view.innerHTML =
      '<span class="chip" style="width:56px;height:56px;border-radius:16px;margin-bottom:24px">' + icon("calendar", 26) + "</span>" +
      "<h2>Odměny za účet jsou až od 18 let</h2>" +
      '<p class="sub" style="margin-bottom:12px">Banky platí jen lidem, kteří můžou smlouvu podepsat sami. ' +
      "Do osmnácti si účet založit můžeš, ale potřebuješ k tomu rodiče. Takový účet bonus nenese.</p>" +
      '<p class="sub">Sepsali jsme, které účty od 15 let stojí za to a co k založení potřebuješ.</p>' +
      '<div class="row">' +
      '<button class="go" data-act="minors">Účty od 15 let ' + icon("arrow", 18) + "</button>" +
      '<button class="ghost" data-act="reset">' + icon("chevron", 18) + " Zpátky</button>" +
      "</div>";
    bind();
  }

  function renderQuestion(cur) {
    const selected = isMulti(cur) ? (answers[cur.key] || []) : [answers[cur.key]];
    // Po kliknutí se překresluje celý seznam. Kdyby se rozjezd pouštěl pokaždé,
    // odpovědi by při každém výběru poskočily — proto jen při změně otázky.
    const fresh = renderedStep !== step;
    renderedStep = step;
    const entry = (i) => (fresh ? ' style="animation-delay:' + (i * 45) + 'ms"' : "");
    let html =
      '<div class="qhead"><span class="chip">' + icon(cur.icon, 20) + "</span>" +
      '<span class="pips" role="img" aria-label="Otázka ' + (step + 1) + " z " + total + '">' +
      QUESTIONS.map((q, i) =>
        '<i class="' + (i < step ? "done" : i === step ? "now" : "") + '"></i>'
      ).join("") + "</span></div>" +
      "<h2>" + esc(cur.q) + "</h2>" +
      '<p class="sub">' + esc(cur.sub) + "</p>";

    if (isMulti(cur)) {
      html += '<div class="tiles">' + cur.options.map((o, i) => {
        const on = selected.includes(o.value);
        return '<button class="tile' + (on ? " on" : "") + (fresh ? " enter" : "") +
          (popped === String(o.value) ? " pop" : "") + '"' + entry(i) +
          ' data-val="' + esc(o.value) + '" aria-pressed="' + on + '">' +
          logo(o.value, 48) +
          '<span class="name">' + esc(o.label) + "</span>" +
          (on ? '<span class="tick">' + icon("check", 12) + "</span>" : "") +
          "</button>";
      }).join("") + "</div>";
    } else {
      html += '<div class="stack">' + cur.options.map((o, i) => {
        const on = selected.includes(o.value);
        return '<button class="opt' + (on ? " on" : "") + (fresh ? " enter" : "") +
          (popped === String(o.value) ? " pop" : "") + '"' + entry(i) +
          ' data-val="' + esc(o.value) + '">' +
          (o.icon ? '<span class="ico">' + icon(o.icon, 20) + "</span>" : "") +
          '<span class="txt"><span class="lab">' + esc(o.label) + "</span>" +
          (o.hint ? '<span class="hint">' + esc(o.hint) + "</span>" : "") + "</span>" +
          '<span class="key">' + (on ? icon("check", 14) : LETTERS[i]) + "</span>" +
          "</button>";
      }).join("") + "</div>";
    }

    const canAdvance = isMulti(cur) || answers[cur.key] !== undefined;
    html += '<div class="row">' +
      (canAdvance
        ? '<button class="go" data-act="next">' +
          (isMulti(cur) && selected.length === 0 ? "Nemám ani jednu" : "OK") +
          " " + icon("arrow", 18) + "</button>"
        : "") +
      '<span class="hintline">nebo stiskni <strong>Enter ↵</strong></span>' +
      // Zpět z první otázky vede na úvod, takže tlačítko je i tam.
      '<button class="back" data-act="prev">' + icon("chevron", 15) + " Zpět</button>" +
      "</div>";

    view.innerHTML = html;
    bind();
  }

  function renderResult() {
    const matched = matchOffers(answers);
    const sum = matched.reduce((s, o) => s + o.amount, 0);

    // Co konkrétně odpověď blokuje, ví jen tenhle výpočet — proto se to
    // v prázdném stavu říká adresně místo obecného „zkus něco změnit".
    const blocked = OFFERS.filter((o) => !(answers.owned || []).includes(o.id));
    const byCards = blocked.filter((o) => o.minCards > (answers.cards ?? 99)).length;
    const byIncome = blocked.filter((o) => o.minIncome > (INCOME[answers.income ?? "yes"] ?? Infinity)).length;

    // Veverka jásá jen nad nějakou odměnou; nad prázdným výsledkem by
    // gratulovala k ničemu.
    const head =
      '<div class="eyebrow">' + icon("sparkles", 16) + "<span>Tvůj výsledek</span></div>" +
      '<p class="sum mine" id="sum">' + czk(0) + "</p>" +
      '<p class="sub">' + (matched.length === 0
        ? "Na tvoje odpovědi zatím nesedí žádný bonus."
        : "Tolik můžeš získat u " + matched.length + " " + (matched.length === 1 ? "banky" : "bank") + ".") +
      "</p>";

    let html = matched.length === 0
      ? head
      : '<div class="win"><div>' + head + "</div>" +
        '<span class="cheer"><img src="' + CHEER + '" alt="" aria-hidden="true" ' +
        'width="719" height="760" decoding="async"></span></div>';

    if (matched.length === 0) {
      html += '<div class="empty"><p>' +
        (blocked.length === 0
          ? "Účet máš už u všech bank, které teď bonus dávají."
          : byCards >= byIncome
            ? "Nejvíc bonusů ti bere počet plateb kartou: " + byCards + " " +
              plural(byCards, "nabídka jich chce", "nabídky jich chtějí", "nabídek jich chce") +
              " víc, než jsi zadal."
            : "Nejvíc bonusů stojí na příchozí platbě: " + byIncome + " " +
              plural(byIncome, "nabídka ji vyžaduje", "nabídky ji vyžadují", "nabídek ji vyžaduje") +
              " vyšší, než kterou zvládneš.") +
        "</p>" +
        '<div class="row">' +
        '<button class="go" data-act="prev">' + icon("chevron", 18) + " Upravit odpovědi</button>" +
        '<button class="ghost" data-act="reset">Projít znovu</button>' +
        "</div></div>";
    }

    html += '<div class="stack offers">' + matched.map((o, i) => {
      // Při shodě částek by odznak dostala první v pořadí, aniž by byla vyšší.
      const best = i === 0 && matched.length > 1 && o.amount > matched[1].amount;
      return '<div class="offer' + (best ? " best" : "") + '" style="animation-delay:' + (i * 90) + 'ms">' +
        (best ? '<span class="flag">' + icon("trending", 13) + "Nejvyšší bonus</span>" : "") +
        '<div class="top">' + logo(o.id, 44) +
        '<span class="bank">' + esc(o.bank) + "</span>" +
        '<span class="amt">' + czk(o.amount) + "</span></div>" +
        '<p class="note">' + esc(o.note) + "</p>" +
        '<div class="foot"><span class="ok">' + icon("check", 15) + " Splňuješ podmínky</span>" +
        '<button class="cta" data-act="offer">Získat bonus ' + icon("arrow", 16) + "</button></div></div>";
    }).join("") + "</div>";

    const services = SERVICES.filter((s) => !(answers.apps || []).includes(s.id));

    if (services.length > 0) {
      html += '<div class="svcblock"><h3>Kde ještě dostaneš uvítací kredit</h3>' +
        // Částka tu chybí schválně — viz komentář u SERVICES. Radši to přiznat
        // než tipovat číslo, které se do dvou týdnů rozejde.
        '<p class="svclead">Výši kreditu určuje aktuální akce, uvidíš ji při registraci.</p>' +
        '<div class="stack svcs">' + services.map((s) =>
          '<div class="svc">' + logo(s.id, 44) +
          '<span class="txt"><span class="lab">' + esc(s.name) +
          '<span class="tag">' + esc(s.tag) + "</span></span>" +
          '<span class="note">' + esc(s.note) + "</span></span>" +
          '<button class="try" data-act="offer">Vyzkoušet ' + icon("arrow", 14) + "</button></div>"
        ).join("") + "</div></div>";
    }

    if (matched.length > 0 || services.length > 0) {
      html += '<p class="fine">Odkazy jsou partnerské. Pořadí určuje výše bonusu, ne provize.</p>' +
        '<button class="again" data-act="reset">Projít znovu</button>';
    }

    view.innerHTML = html;
    animateTo(document.getElementById("sum"), sum);
    bind();
  }

  /* ---- events ------------------------------------------------------ */

  function bind() {
    view.querySelectorAll("[data-val]").forEach((el) => {
      el.addEventListener("click", () => {
        const cur = QUESTIONS[step];
        const raw = el.getAttribute("data-val");
        const opt = cur.options.find((o) => String(o.value) === raw);
        if (opt) pick(cur, opt.value);
      });
    });

    view.querySelectorAll("[data-act]").forEach((el) => {
      el.addEventListener("click", () => {
        const act = el.getAttribute("data-act");
        if (act === "start" || act === "next") go(step + 1);
        else if (act === "prev") go(step - 1);
        else if (act === "reset") reset();
      });
    });
  }

  window.addEventListener("keydown", (e) => {
    if (step >= total || answers.age === "under18") return;
    if (step === INTRO) {
      // Písmena tady nic nevybírají, takže si je nechává prohlížeč.
      if (e.key === "Enter") go(0);
      return;
    }
    const cur = QUESTIONS[step];
    if (e.key === "Enter") {
      if (isMulti(cur) || answers[cur.key] !== undefined) go(step + 1);
      return;
    }
    if (e.key.length !== 1) return;
    const idx = LETTERS.indexOf(e.key.toUpperCase());
    if (idx >= 0 && idx < cur.options.length) pick(cur, cur.options[idx].value);
  });

  render();
</script>
</body>
</html>
